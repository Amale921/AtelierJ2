[project]
name = "queenbee"
version = "0.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["queenbee"]

[tool.importlinter]
root_package = "queenbee"

[[tool.importlinter.contracts]]
name = "Hexagone : adapters -> application -> domain (jamais l'inverse)"
type = "layers"
layers = [
    "queenbee.adapters",
    "queenbee.application",
    "queenbee.domain",
]
